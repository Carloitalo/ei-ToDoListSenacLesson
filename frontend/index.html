<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Todo List</title>
</head>

<body>

<main class="container">

    <!-- ===============================
         HEADER (PRONTO)
    =============================== -->
    <header class="header">
        <h1>Todo List</h1>
        <p>Organize suas tarefas de forma moderna e eficiente</p>
    </header>


    <!-- ===============================
         DESAFIO 1 (HTML)
         Aluno: deve montar os cards
    =============================== -->
    <section class="stats">

        <!-- TODO: criar 3 cards -->
        <!-- Dica: Total | Ativas | Completas -->
         <div class="card">
            <span class="numero">3</span>
            <p>Total</p>
         </div>
         <div class="card">
            <span class="numero">2</span>
            <p>Ativas</p>
         </div>
         <div class="card">
            <span class="numero">1</span>
            <p>Completas</p>
         </div>

    </section>


    <!-- ===============================
         ADD TASK (PRONTO)
    =============================== -->
    <section class="add-task">
        <input type="text" placeholder="Adiciona nova tarefa...">
        <button class="btn-add">+ Adicionar</button>
    </section>


    <!-- ===============================
         FILTROS (PARCIAL)
         Aluno: pode estilizar e melhorar
    =============================== -->
    <section class="filters">
        <button class="filter active">Todas</button>
        <button class="filter">Ativas</button>
        <button class="filter">Completas</button>
    </section>


    <!-- ===============================
        LISTA (PRONTA E VAZIA)
    =============================== -->
    <section class="tasks">
        <ul>
            <li>Cria uma todo list moderna</li>
        </ul>
        <!-- JS vai renderizar aqui -->
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
